<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FrontLines{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v=20260513-variants-scroll">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ base_path }}/">FrontLines</a>
    {% if request.session.get("authenticated") %}
    <nav>
      <a href="{{ base_path }}/">Dashboard</a>
      <a href="{{ base_path }}/hv">HV</a>
      <a href="{{ base_path }}/shopify">Shopify</a>
      <a href="{{ base_path }}/settings">Settings</a>
      <form method="post" action="{{ base_path }}/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link-button" type="submit">Logout</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="page">
    {% if message %}<div class="flash success">{{ message }}</div>{% endif %}
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
